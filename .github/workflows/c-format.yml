name: C format

on: 
  pull_request:

permissions:
  contents: read

jobs:
  c-format:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: C formatting
      shell: bash
      run: find crates -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.cu' -o -name '*.cuh' \) -exec clang-format --dry-run --Werror {} +
         
